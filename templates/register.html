<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VoxAI Studio</title>

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <!-- Google Auth Configuration -->
  <div id="g_id_onload"
       data-client_id="{% if config.GOOGLE_CLIENT_ID and not config.GOOGLE_CLIENT_ID.startswith('your-google-client-id') %}{{ config.GOOGLE_CLIENT_ID }}{% endif %}"
       data-context="signup"
       data-ux_mode="popup"
       data-callback="handleGoogleSignIn"
       data-auto_prompt="false"
       data-itp_support="true">
  </div>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-logo">
        <i class="bi bi-soundwave"></i>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join VoxAI Studio to synthesize high-quality speech</p>

      <form class="auth-form" id="register-form">
        <div>
          <label class="control-label" for="username">Username</label>
          <input type="text" id="username" class="input-custom" placeholder="johndoe" required minlength="3">
        </div>

        <div>
          <label class="control-label" for="email">Email Address</label>
          <input type="email" id="email" class="input-custom" placeholder="john@example.com" required>
        </div>

        <div>
          <label class="control-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="input-custom" placeholder="••••••••" required minlength="6">
            <button type="button" class="password-toggle-btn" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="control-label" for="confirm_password">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm_password" class="input-custom" placeholder="••••••••" required minlength="6">
            <button type="button" class="password-toggle-btn" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 10px;">
          Create Account <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div style="margin: 20px 0 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span style="height: 1px; background: var(--glass-border); flex: 1;"></span>
        <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Or signup with</span>
        <span style="height: 1px; background: var(--glass-border); flex: 1;"></span>
      </div>

      <div id="google-signin-wrapper" style="width: 100%; margin-top: 10px;">
        {% if config.GOOGLE_CLIENT_ID and not config.GOOGLE_CLIENT_ID.startswith('your-google-client-id') %}
        <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_dark" data-text="signup_with" data-size="large" data-logo_alignment="left" data-width="100%"></div>
        {% endif %}
        <button type="button" class="btn-google" id="google-signin-btn" style="width: 100%;">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg" style="display: block;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <p style="margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="/login">Sign In</a>
      </p>
    </div>

    <footer class="auth-footer">
      <a href="/privacy">Privacy Policy</a> | 
      <a href="/terms">Terms & Conditions</a>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
